<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/app.js"></script>
    <title>Marketplace UNAB</title>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid navbar-custom">

            <a class="navbar-brand" href="#">
                <img src="assets/img/logo_marketplace_unab.png" alt="Marketplace UNAB" class="logo-navbar">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
                aria-controls="navbarContenido" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContenido">
                <div class="navbar-actions d-flex align-items-center gap-3">
                    <a href="#" class="btn btn-primary btn-publicacion" data-bs-toggle="modal" data-bs-target="#modalPublicar">
                        Crear nueva publicación
                    </a>
                    <a href="#" class="nav-icon position-relative" aria-label="Favoritos" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFavoritos">
                        <img src="assets/img/icono_fav.png" alt="Favoritos" style="width: 28px;">
                        <span id="contador-favoritos" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.7rem;">
                            0
                        </span>
                    </a>
                    <a href="#" class="nav-icon position-relative" aria-label="Carrito" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
                        <img src="assets/img/icono_carrito.png" alt="Carrito" style="width: 28px;">
                        <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.7rem;">
                            0
                        </span>
                    </a>

                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <aside class="col-12 col-lg-2 order-1 order-lg-1 border-end p-3">
                <input type="text" id="inputBuscador" class="form-control mb-3" placeholder="Buscar productos">
                
                <div class="mb-3 bg-light">
                    <h6>Filtro de precios</h6>
                    <label>Min <input type="number" class="form-control mb-2"></label>
                    <label>Max <input type="number" class="form-control"></label>
                </div>

                <div class="mb-3">
                    <button class="btn btn-light w-100 d-flex justify-content-between align-items-center d-lg-none" 
                        type="button" data-bs-toggle="collapse" data-bs-target="#categorias-collapse">
                        Categorías
                        <span>▼</span>
                    </button>
                    
                    <h6 class="d-none d-lg-block">Categorías</h6>
                    <div id="categorias-collapse" class="collapse d-lg-block">
                        <div id="nombre-categorias"></div>
                    </div>
                </div>

            </aside>
            <div class="col-12 col-lg-10 order-2 order-lg-2 p-3">
             <h5 class="mb-3">Publicaciones</h5>
                <div id="publicaciones" class="row g-4"></div>
            </div> 
        </div>
    </div>
    <div class="modal fade" id="modalDetalles" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="detalleNombre">Nombre del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="detalleImagen" src="" alt="Producto" class="img-fluid mb-3 rounded" style="max-height: 250px; object-fit: contain; width: 100%;">
                    <h4 id="detallePrecio" class="text-primary fw-bold"></h4>
                    <span id="detalleCategoria" class="badge bg-secondary mb-3"></span>
                    <p id="detalleDescripcion" class="text-start"></p>
                    <hr>
                    <p class="text-start text-muted small mb-0"><strong>Vendedor:</strong> <span id="detalleVendedor"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalPublicar" tabindex="-1" aria-labelledby="modalPublicarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalPublicarLabel">Publicar Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formulario-producto">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label">Nombre del producto</label>
                            <input type="text" class="form-control" id="inputNombre" required placeholder="Ej: Libro Cálculo...">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="inputPrecio" class="form-label">Precio ($)</label>
                                <input type="number" class="form-control" id="inputPrecio" required min="1">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="selectCategoria" class="form-label">Categoría</label>
                                <select class="form-select" id="selectCategoria" required>
                                    <option value="">Selecciona una...</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="inputDescripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="inputDescripcion" rows="3" required placeholder="Estado del producto, detalles..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="inputImagen" class="form-label">URL de la Imagen</label>
                            <input type="url" class="form-control" id="inputImagen" required placeholder="https://ejemplo.com/imagen.jpg">
                        </div>

                        <div class="mb-3">
                            <label for="inputVendedor" class="form-label">Tus Datos (Nombre y Carrera)</label>
                            <input type="text" class="form-control" id="inputVendedor" required placeholder="Ej: Juan Pérez (Ingeniería)">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Publicar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasFavoritos" aria-labelledby="offcanvasFavoritosLabel">
        <div class="offcanvas-header bg-danger text-white border-bottom">
            <h5 class="offcanvas-title" id="offcanvasFavoritosLabel">❤️ Mis Favoritos</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="items-favoritos" class="flex-grow-1 overflow-auto">
            </div>
        </div>
    </div>

</body>
</html>
